name: merge-stable-6.1.y

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Full checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Take google android14-6.1 (SUBLEVEL 176) as new base
        shell: bash
        run: |
          set -e
          git config user.email "merge@local"
          git config user.name "merge-bot"
          git remote add common https://android.googlesource.com/kernel/common || true
          git fetch common refs/heads/android14-6.1:refs/remotes/common/android14-6.1
          git show refs/remotes/common/android14-6.1:Makefile | grep '^SUBLEVEL ='
          # vendor delta over the old android14-6.1 baseline was empty, so the
          # upstream HEAD is the upgraded kernel itself.
          git checkout -b bump-android14-6.1-176 refs/remotes/common/android14-6.1
          echo "new_sublevel=$(grep '^SUBLEVEL =' Makefile)"
          git push --force origin bump-android14-6.1-176
          echo "pushed bump-android14-6.1-176"
