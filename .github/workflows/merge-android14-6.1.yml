name: merge-stable-6.1.y

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Full checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch stable refs (v6.1.128 and linux-6.1.y)
        shell: bash
        run: |
          set -e
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git || true
          git fetch stable refs/tags/v6.1.128:refs/tags/v6.1.128 refs/heads/linux-6.1.y:refs/remotes/stable/linux-6.1.y
          git show refs/remotes/stable/linux-6.1.y:Makefile | grep '^SUBLEVEL ='

      - name: Apply 128..187 stable diff (3way with reject)
        shell: bash
        run: |
          set -e
          git config user.email "merge@local"
          git config user.name "merge-bot"
          git diff refs/tags/v6.1.128 refs/remotes/stable/linux-6.1.y > /tmp/stable.patch
          echo "patch_files=$(git apply --numstat /tmp/stable.patch | wc -l)"
          git apply --3way --reject --whitespace=nowarn /tmp/stable.patch > /tmp/apply.out 2>&1 || true
          git ls-files -u | awk '{print $4}' | sort -u > unmerged.txt || true
          find . -name '*.rej' -type f | sort > rejects.txt || true
          echo "conflict_count=$(wc -l < unmerged.txt || echo 0)"
          echo "reject_count=$(wc -l < rejects.txt || echo 0)"
          echo "=== unmerged ==="; cat unmerged.txt
          echo "=== rejects ==="; cat rejects.txt
          CONFLICTS=$(wc -l < unmerged.txt || echo 0)
          if [ "$CONFLICTS" = "0" ]; then
            git add -A
            git commit -m "kernel: bump stable 6.1.128 -> 6.1.187" || echo "nothing to commit"
            echo "new_sublevel=$(git show HEAD:Makefile | grep '^SUBLEVEL =')"
            git push origin HEAD:refs/heads/bump-stable-6.1.187
          else
            echo "has conflicts, not committing"
          fi

      - name: Upload merge report
        uses: actions/upload-artifact@v4
        with:
          name: merge-report
          path: |
            unmerged.txt
            rejects.txt
          if-no-files-found: ignore
