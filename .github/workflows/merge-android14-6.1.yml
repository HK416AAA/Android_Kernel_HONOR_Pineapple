name: merge-stable-6.1.y

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Full checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch stable refs (v6.1.128 and linux-6.1.y)
        shell: bash
        run: |
          set -e
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git || true
          git fetch stable refs/tags/v6.1.128:refs/tags/v6.1.128 refs/heads/linux-6.1.y:refs/remotes/stable/linux-6.1.y
          git show refs/remotes/stable/linux-6.1.y:Makefile | grep '^SUBLEVEL ='

      - name: Apply and diagnose
        shell: bash
        run: |
          set -e
          git diff refs/tags/v6.1.128 refs/remotes/stable/linux-6.1.y > /tmp/stable.patch
          echo "patch_files=$(git apply --numstat /tmp/stable.patch | wc -l)"
          echo "makefile_in_patch=$(git apply --numstat /tmp/stable.patch | grep -c Makefile || true)"
          git apply --3way --reject --whitespace=nowarn /tmp/stable.patch > /tmp/apply.out 2>&1 || true
          echo "apply_error_lines=$(grep -c 'error' /tmp/apply.out || true)"
          echo "=== apply errors head ==="; grep error /tmp/apply.out | head -30
          echo "=== makefile diff after ==="; git diff -- Makefile | head -20
          echo "=== sublevel now ==="; grep '^SUBLEVEL =' Makefile
          git status --short > merge_status.txt || true

      - name: Upload diag
        uses: actions/upload-artifact@v4
        with:
          name: merge-report
          path: |
            /tmp/apply.out
            /tmp/stable.patch
            merge_status.txt
          if-no-files-found: ignore
