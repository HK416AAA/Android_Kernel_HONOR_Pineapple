name: Build Kernel 176 (google base + vendor overlay)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    steps:
      - name: Checkout vendor kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick libelf-dev liblz4-tool libssl-dev lzop rsync schedtool squashfs-tools zip zlib1g-dev dwarves

      - name: Fetch google android14-6.1 full history
        run: |
          git remote add common https://android.googlesource.com/kernel/common || true
          git fetch common refs/heads/android14-6.1:refs/remotes/common/android14-6.1

      - name: Locate google baseline at SUBLEVEL 128
        shell: bash
        run: |
          set -e
          BASE=""
          for c in $(git rev-list refs/remotes/common/android14-6.1 -- Makefile | head -4000); do
            s=$(git show $c:Makefile 2>/dev/null | awk '/^SUBLEVEL =/{print $3}')
            if [ "$s" = "128" ]; then BASE=$c; break; fi
          done
          echo "base128=$BASE"
          echo "$BASE" > /tmp/base128
          git show "$BASE":Makefile | grep '^SUBLEVEL ='

      - name: Build vendor-only delta and overlay onto 176
        shell: bash
        run: |
          set -e
          BASE=$(cat /tmp/base128)
          echo "upstream176=$(git show refs/remotes/common/android14-6.1:Makefile | grep '^SUBLEVEL =')"
          git diff "$BASE" HEAD > /tmp/vendor.patch
          echo "vendor_patch_files=$(git apply --numstat /tmp/vendor.patch | wc -l)"
          git worktree add /tmp/ktree refs/remotes/common/android14-6.1
          cd /tmp/ktree
          git apply --3way /tmp/vendor.patch 2>/tmp/vendor_apply.log || git apply --reject /tmp/vendor.patch >> /tmp/vendor_apply.log 2>&1 || true
          grep -c 'error' /tmp/vendor_apply.log || true
          grep '^SUBLEVEL =' Makefile
          ls -la arch/arm64/configs/merge_pineapple_defconfig

      - name: Fetch Android 15 Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          git clone --depth=1 -b android15-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/clang

      - name: Setup KernelSU (SukiSU + Susfs)
        working-directory: /tmp/ktree
        run: |
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-dev

      - name: Build Kernel
        working-directory: /tmp/ktree
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/clang-r522817/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          mkdir -p out
          make O=out merge_pineapple_defconfig
          make -j$(nproc) O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Image-176
          path: |
            /tmp/ktree/out/arch/arm64/boot/Image
            /tmp/ktree/out/arch/arm64/boot/Image.gz
