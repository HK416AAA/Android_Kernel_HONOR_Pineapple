name: Apply stable 128->187 to vendor tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Full checkout (vendor tree)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch linux-stable refs (v6.1.128 + linux-6.1.y)
        shell: bash
        run: |
          set -e
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git || true
          git fetch stable refs/tags/v6.1.128:refs/tags/v6.1.128 refs/heads/linux-6.1.y:refs/remotes/stable/linux-6.1.y
          echo "target_sublevel=$(git show refs/remotes/stable/linux-6.1.y:Makefile | grep '^SUBLEVEL =')"

      - name: Apply stable patch with --reject
        shell: bash
        run: |
          set -e
          git config user.email "merge@local"
          git config user.name "merge-bot"
          git diff refs/tags/v6.1.128 refs/remotes/stable/linux-6.1.y > /tmp/stable.patch
          echo "patch_files=$(git apply --numstat /tmp/stable.patch | wc -l)"
          git apply --reject --whitespace=nowarn /tmp/stable.patch > /tmp/apply.out 2>&1 || true
          echo "apply_error_lines=$(grep -c 'error' /tmp/apply.out || true)"
          find . -name '*.rej' -type f | sort > rejects.txt || true
          echo "reject_count=$(wc -l < rejects.txt || echo 0)"
          echo "=== rejects (first 60) ==="; head -60 rejects.txt
          echo "new_sublevel=$(grep '^SUBLEVEL =' Makefile)"
          echo "defconfig_present=$([ -f arch/arm64/configs/merge_pineapple_defconfig ] && echo yes || echo no)"

      - name: Resolve rejects (keep vendor files), bump Makefile, commit
        shell: bash
        run: |
          set -e
          # conflicted files are kernel core/headers: take the full upstream
          # stable(187) version so macros/structs line up with the applied hunks.
          while read -r rej; do
            f="${rej%.rej}"; f="${f#./}"
            git show refs/remotes/stable/linux-6.1.y:"$f" > "$f" 2>/dev/null || git checkout HEAD -- "$f"
            rm -f "$rej"
          done < rejects.txt || true
          find . -name '*.rej' -delete
          # Makefile fully from stable (SUBLEVEL 187)
          git show refs/remotes/stable/linux-6.1.y:Makefile > Makefile
          echo "resolved_sublevel=$(grep '^SUBLEVEL =' Makefile)"
          echo "conflict_files_now_stable=$(wc -l < rejects.txt || echo 0)"
          git add -A
          git commit -m "kernel: stable 6.1.128 -> 6.1.187 (vendor files preserved on conflict)" || echo "nothing to commit"
          git push origin HEAD:refs/heads/stable187-apply

      - name: Upload apply report
        uses: actions/upload-artifact@v4
        with:
          name: merge-report
          path: rejects.txt
          if-no-files-found: ignore
